name: Scoped proxy image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag for the maintained fork
        required: true
        default: 8.0.58-keys.1

permissions:
  contents: read
  packages: write

concurrency:
  group: scoped-image-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release version
        shell: bash
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-keys\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
      - name: Checkout matching management UI
        uses: actions/checkout@v4
        with:
          repository: kv9898/Cli-Proxy-API-Management-Center
          ref: 0cda75a980eb2d43b217396b2b8e1cdd1d777d0b
          path: management-ui
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify and build matching management UI
        working-directory: management-ui
        run: bun install --frozen-lockfile && bun run verify
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify scoped authentication and account isolation
        run: go test ./internal/clientkeys ./internal/access/config_access ./internal/api/... ./sdk/api/handlers/... ./sdk/cliproxy/auth -run 'Test(ScopedKey|ManagedKey|ClientKey|ManagedKeys|Counter)' -count=1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/kv9898/cliproxyapi:${{ inputs.version }}-api-${{ matrix.arch }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.run_id }}
          cache-from: type=gha,scope=scoped-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=scoped-${{ matrix.arch }}
      - name: Publish paired API and UI image
        uses: docker/build-push-action@v6
        id: paired
        with:
          context: .
          file: Dockerfile.panel
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/kv9898/cliproxyapi:${{ inputs.version }}-${{ matrix.arch }}
          build-args: |
            API_IMAGE=ghcr.io/kv9898/cliproxyapi@${{ steps.api.outputs.digest }}
      - name: Smoke-test native paired image
        env:
          PAIRED_DIGEST: ${{ steps.paired.outputs.digest }}
        run: |
          docker pull "ghcr.io/kv9898/cliproxyapi@$PAIRED_DIGEST"
          bash deploy/oracle/smoke-image.sh "ghcr.io/kv9898/cliproxyapi@$PAIRED_DIGEST"
      - name: Save immutable image references
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          PAIRED_DIGEST: ${{ steps.paired.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p references
          jq -n --arg api "ghcr.io/kv9898/cliproxyapi@$API_DIGEST" --arg paired "ghcr.io/kv9898/cliproxyapi@$PAIRED_DIGEST" '{api:$api,paired:$paired}' > "references/$ARCH.json"
      - uses: actions/upload-artifact@v4
        with:
          name: image-references-${{ matrix.arch }}
          path: references/*.json
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-references-*
          path: references
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifests
        shell: bash
        run: |
          mapfile -t api < <(jq -r .api references/amd64.json references/arm64.json)
          mapfile -t paired < <(jq -r .paired references/amd64.json references/arm64.json)
          docker buildx imagetools create --tag "ghcr.io/kv9898/cliproxyapi:$VERSION-api" "${api[@]}"
          docker buildx imagetools create --tag "ghcr.io/kv9898/cliproxyapi:$VERSION" "${paired[@]}"
          docker buildx imagetools inspect --raw "ghcr.io/kv9898/cliproxyapi:$VERSION" | jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)'
          docker buildx imagetools inspect "ghcr.io/kv9898/cliproxyapi:$VERSION" | tee release-manifest.txt
          echo 'Deploy the paired image digest below; never deploy the intermediate API image.' >> "$GITHUB_STEP_SUMMARY"
          cat release-manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.txt
          retention-days: 90
